name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# ワークフロー全体のデフォルト権限を最小限（読み取り専用）に制限
permissions:
  contents: read

# 同時実行の制御（進行中のデプロイがある場合はキャンセルして最新を優先）
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Node.js のセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 依存パッケージのインストール
        run: npm ci

      - name: 単体テストの実行
        run: npm run test

      - name: プロジェクトのビルド
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npm run build

      - name: Pages アーティファクトのアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    # デプロイに必要な権限のみを deploy ジョブに限定して付与
    permissions:
      pages: write
      id-token: write
    steps:
      - name: GitHub Pages へのデプロイ
        id: deployment
        uses: actions/deploy-pages@v4
